# Builds the offline Android APK (arm64, Android 10+): cross-compiles ffmpeg/ffprobe (x264), QuickJS and
# whisper.cpp with the NDK, then Gradle + Chaquopy bundle Python and the shared clipcutter pipeline.
# On a version tag (v1.2.3) the APK is attached to the draft GitHub Release (same as the desktop builds).
name: Android app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml", "src/clipcutter/system.py", "src/clipcutter/analyze.py"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }     # Chaquopy needs the same Python version on the build machine
      - name: Version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "CLIPCUTTER_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"; fi
      - name: NDK + build tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build pkg-config nasm
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Cache native tools
        id: native
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs
          key: android-native-${{ env.NDK_VERSION }}-${{ hashFiles('android/native/build.sh') }}
      - name: Build ffmpeg, ffprobe, qjs, whisper-cli (arm64)
        if: steps.native.outputs.cache-hit != 'true'
        run: android/native/build.sh
      - name: Fonts
        run: ONLY=fonts android/native/build.sh
      - name: Release signing key (optional secret)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/release.keystore
            printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > android/keystore.properties
          fi
      - name: Build APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Collect
        run: |
          V=${CLIPCUTTER_VERSION:-$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)}
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/ClipCutter-$V-android-arm64.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/ClipCutter-$V-android-arm64-debug.apk"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" dist/ClipCutter-*-android-arm64.apk --clobber
